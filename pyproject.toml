[project]
name = "opscope"
version = "0.1.0"
description = "VALORANT Operator & utility scouting tool for Cloud9 coaches"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pandas",
    "plotly",
    "streamlit",
    "python-dotenv",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.4",
    "pillow>=13.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opscope"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
