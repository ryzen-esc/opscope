<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpScope</title>
<link rel="icon" href="img/opscope-icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="progress" id="progress"></div>
<header class="bar" id="bar">
  <a class="logo" href="?" aria-label="OpScope home">
    <img src="img/opscope-icon.svg" alt="" width="22" height="22"><span>OP<b>SCOPE</b></span>
  </a>
  <button class="switch" id="switch" type="button" aria-haspopup="dialog">
    <span class="switch-team" id="switchTeam">Loading…</span><kbd>⌘K</kbd>
  </button>
  <nav class="views" id="views" aria-label="Views">
    <a href="#" data-view="overview" class="on">Overview</a>
    <a href="#" data-view="dashboard">Dashboard</a>
    <a href="#" data-view="method">How it works</a>
  </nav>
</header>

<main id="app" aria-live="polite"></main>

<div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Scout a team" hidden>
  <div class="palette-box">
    <input id="paletteInput" type="text" placeholder="Scout a team…" autocomplete="off" spellcheck="false">
    <ul id="paletteList" role="listbox"></ul>
    <div class="palette-foot"><span>↑ ↓ to move</span><span>↵ to open</span><span>esc to close</span></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="vendor/lenis/lenis.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
